name: Bug report
description: Report a reproducible defect in app, contracts, docs, or infra.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do **not** use this form.
        Use private reporting in `SECURITY.md`.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App UI/UX
        - Wallet/transaction flow
        - Smart contracts
        - API/ops
        - Docs/public copy
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: chain, wallet, browser, and URL used
      placeholder: "Base Sepolia, Rabby, Chrome 136, https://app.myblank.app"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Go to ... 2. Click ... 3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: tx hash, screenshot, video, console log, or failing test
      placeholder: "0x..., image link, log snippet"
    validations:
      required: true
