<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pay with Blank</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        color: #1d1d1f;
        background: #f9fafb;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 20px;
      }
      h1 {
        margin: 0 0 4px 0;
        font-size: 18px;
        letter-spacing: -0.3px;
      }
      .lede {
        margin: 0 0 16px 0;
        font-size: 12px;
        color: #71717a;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #71717a;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input,
      .open-app {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #e4e4e7;
        font-size: 13px;
      }
      input:focus {
        outline: none;
        border-color: #1d1d1f;
        box-shadow: 0 0 0 3px rgba(29, 29, 31, 0.05);
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .save,
      .open-app {
        flex: 1;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        border: none;
      }
      .save {
        background: #1d1d1f;
        color: white;
      }
      .open-app {
        background: #f4f4f5;
        color: #1d1d1f;
      }
      .save:hover {
        background: #10b981;
      }
      .footer {
        margin-top: 20px;
        font-size: 11px;
        color: #a1a1aa;
        text-align: center;
      }
      #status {
        font-size: 11px;
        color: #10b981;
        margin-top: 6px;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Pay with Blank</h1>
    <p class="lede">
      Adds a one-click "Pay" button next to every Ethereum address and ENS name
      on any website.
    </p>

    <label for="origin">App URL</label>
    <input
      id="origin"
      type="url"
      placeholder="https://blank-omega-jade.vercel.app"
      autocomplete="off"
    />
    <div class="row">
      <button class="save" id="save">Save</button>
      <a class="open-app" id="open" href="#" target="_blank" rel="noopener">
        Open Blank
      </a>
    </div>
    <p id="status"></p>

    <p class="footer">v0.1 · Encrypted payments on Fhenix CoFHE</p>
    <script src="popup.js"></script>
  </body>
</html>
