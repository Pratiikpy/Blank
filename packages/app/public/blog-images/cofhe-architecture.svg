<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">FHE Layer 1 vs FHE co-processor architecture</title>
  <desc id="desc">Two side-by-side architecture diagrams. On the left, an FHE Layer 1 where every node runs FHE operations. On the right, an FHE co-processor model where Ethereum stays a plain EVM and FHE work is delegated to a threshold network of operators that produce verifiable permits.</desc>

  <defs>
    <style>
      .frame { fill: none; stroke: #1d1d1f; stroke-width: 1.5; }
      .frame-dashed { fill: none; stroke: #1d1d1f; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .chip { fill: #f5f6f4; stroke: #1d1d1f; stroke-width: 1.2; }
      .chip-dark { fill: #1d1d1f; stroke: #1d1d1f; stroke-width: 1.2; }
      .title { font: 600 16px/1 "Outfit", system-ui, sans-serif; fill: #1d1d1f; }
      .label { font: 500 13px/1.3 "Outfit", system-ui, sans-serif; fill: #1d1d1f; }
      .label-light { font: 500 13px/1.3 "Outfit", system-ui, sans-serif; fill: #ffffff; }
      .caption { font: 500 11px/1.2 "JetBrains Mono", ui-monospace, monospace; fill: #6b7280; letter-spacing: 0.06em; text-transform: uppercase; }
      .arrow { fill: none; stroke: #1d1d1f; stroke-width: 1.5; }
      .accent { fill: #047857; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: FHE Layer 1 -->
  <text x="20" y="32" class="caption">Path 1</text>
  <text x="20" y="58" class="title">FHE Layer 1</text>
  <rect x="20" y="80" width="340" height="240" rx="8" class="frame"/>
  <text x="40" y="106" class="label">FHE-native chain</text>

  <!-- chain nodes, each runs FHE -->
  <g>
    <rect x="40" y="130" width="90" height="50" rx="6" class="chip-dark"/>
    <text x="85" y="155" text-anchor="middle" class="label-light">Node · FHE</text>
    <text x="85" y="172" text-anchor="middle" class="label-light" font-size="11" opacity="0.7">ciphertext ops</text>
  </g>
  <g>
    <rect x="145" y="130" width="90" height="50" rx="6" class="chip-dark"/>
    <text x="190" y="155" text-anchor="middle" class="label-light">Node · FHE</text>
    <text x="190" y="172" text-anchor="middle" class="label-light" font-size="11" opacity="0.7">ciphertext ops</text>
  </g>
  <g>
    <rect x="250" y="130" width="90" height="50" rx="6" class="chip-dark"/>
    <text x="295" y="155" text-anchor="middle" class="label-light">Node · FHE</text>
    <text x="295" y="172" text-anchor="middle" class="label-light" font-size="11" opacity="0.7">ciphertext ops</text>
  </g>

  <rect x="40" y="220" width="300" height="44" rx="6" class="chip"/>
  <text x="190" y="240" text-anchor="middle" class="label">Application contracts</text>
  <text x="190" y="256" text-anchor="middle" class="label" font-size="11" opacity="0.65">native to this chain only</text>

  <text x="40" y="295" class="label" font-size="11" opacity="0.7">+ purity: chain == FHE</text>
  <text x="40" y="311" class="label" font-size="11" opacity="0.7">- new wallet / bridge / liquidity story</text>

  <!-- RIGHT PANEL: FHE Co-processor -->
  <text x="440" y="32" class="caption">Path 2</text>
  <text x="440" y="58" class="title">FHE co-processor <tspan class="accent">(Fhenix CoFHE, what Blank uses)</tspan></text>
  <rect x="440" y="80" width="340" height="240" rx="8" class="frame"/>

  <!-- plain Ethereum on left -->
  <text x="460" y="106" class="label">Plain Ethereum / L2</text>
  <rect x="460" y="120" width="130" height="60" rx="6" class="chip"/>
  <text x="525" y="143" text-anchor="middle" class="label">EVM contract</text>
  <text x="525" y="161" text-anchor="middle" class="label" font-size="11" opacity="0.65">holds euint64 handles</text>

  <rect x="460" y="195" width="130" height="40" rx="6" class="chip"/>
  <text x="525" y="218" text-anchor="middle" class="label">TaskManager</text>

  <!-- co-processor on right -->
  <text x="630" y="106" class="label">Co-processor</text>
  <rect x="630" y="120" width="130" height="115" rx="6" class="frame-dashed"/>
  <rect x="640" y="132" width="110" height="32" rx="4" class="chip"/>
  <text x="695" y="152" text-anchor="middle" class="label" font-size="12">Operator</text>
  <rect x="640" y="170" width="110" height="32" rx="4" class="chip"/>
  <text x="695" y="190" text-anchor="middle" class="label" font-size="12">Operator</text>
  <rect x="640" y="208" width="110" height="22" rx="4" class="chip"/>
  <text x="695" y="223" text-anchor="middle" class="label" font-size="11">threshold quorum</text>

  <!-- arrows between the two -->
  <line x1="595" y1="150" x2="625" y2="150" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="610" y="143" text-anchor="middle" class="label" font-size="10" opacity="0.7">task</text>

  <line x1="625" y1="215" x2="595" y2="215" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="610" y="230" text-anchor="middle" class="label" font-size="10" opacity="0.7">permit</text>

  <text x="460" y="265" class="label" font-size="11" opacity="0.7">+ same wallets / bridges / liquidity</text>
  <text x="460" y="281" class="label" font-size="11" opacity="0.7">+ existing dApps stay compatible</text>
  <text x="460" y="297" class="label" font-size="11" opacity="0.7">- trust: threshold quorum must not collude</text>
  <text x="460" y="313" class="label" font-size="11" opacity="0.7">  (slashing + economic security counter this)</text>
</svg>
